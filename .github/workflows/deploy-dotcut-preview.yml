name: Deploy dotcut preview

on:
  push:
    branches:
      - feature/dotcut-vault
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-dotcut-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          commit_message: "Deploy dotcut preview from ${{ github.sha }}"
